spring.application.name=Spring-AI-RAG

# Ollama 設定：
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1:8b
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

# 向量庫設定（使用 SimpleVectorStore）：
spring.ai.vectorstore.simple.initialize-schema=always

# 允許 Bean 覆蓋（教學環境方便實驗）：
spring.main.allow-bean-definition-overriding=true
