spring.application.name=mcp-client-8080

# Ollama LLM 配置
spring.ai.ollama.base-url=http://localhost:11434

# 換成你本地 ollama 支援的模型名稱
spring.ai.ollama.chat.model=llama3.1:8b

# MCP Client 配置
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=my-mcp-client
spring.ai.mcp.client.version=1.0.0
# 啟動 MCP Client 時會主動連線 MCP Server
spring.ai.mcp.client.type=SYNC
# 啟用工具回呼功能(自動把 MCP Server 上的工具掛進 Spring AI 中)
spring.ai.mcp.client.toolcallback.enabled=true
# 定義 MCP Server 連線 (shopping-cart-server <- 自己可以自由命名)
spring.ai.mcp.client.sse.connections.shopping-cart-server.url=http://localhost:9090

# Log 配置
logging.level.org.springframework.ai=DEBUG
logging.level.io.modelcontextprotocol.client=DEBUG
logging.level.io.modelcontextprotocol.spec=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Log 檔案設定
logging.file.name=logs/mcp-ai-debug.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

